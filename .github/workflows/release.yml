name: 'C++ CI'

on:
  push:
    branches:
      - custom_allocator
      - feature/github_actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      # Вычисляем количество коммитов в текущей ветке
      - name: Get commit count in branch
        id: get_commit_count
        run: |
          # HEAD~ — это текущая ветка, считаем коммиты от первого коммита до текущего
          COUNT=$(git rev-list --count HEAD)
          echo "COMMIT_COUNT=$COUNT" >> $GITHUB_ENV

      - run: sudo apt-get update && sudo apt-get install libboost-test-dev -y

      - run: cmake . -DPATCH_VERSION=${{ env.COMMIT_COUNT }} -DWITH_BOOST_TEST=ON
      - run: cmake --build .
      #- run: cmake --build . --target test
      - run: cmake --build . --target package

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v0.0.${{ env.COMMIT_COUNT }}
          release_name: Release v0.0.${{ env.COMMIT_COUNT }}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./custom_allocator-0.0.${{ env.COMMIT_COUNT }}-Linux.deb
          asset_name: custom_allocator-0.0.${{ env.COMMIT_COUNT }}-Linux.deb
          asset_content_type: application/vnd.debian.binary-package